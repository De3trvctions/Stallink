<!-- Stallink favicon 设计稿，不是前端用的最终资源。
     不要复制进 web/src/app 或 web/public；等 Kel 选定后再由前端按 favicon-设计说明.md 导出。
     颜色全部取自现有 token，字形为 path，不依赖外部字体。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title">
  <title id="title">Stallink</title>
  <!-- 主文件：工作台 logo 的 favicon 化。底色工作台 accent #215e58；字 expo-paper / expo-rail-text #f4f0e6；角标 brand-mark #8c3c2d，2 单位纸色描边（赭石压深青约 1.00:1，必须留描边）。圆角 6 对应工作台 radius-control。 -->
  <rect width="32" height="32" rx="6" fill="#215e58"/>
  <path d="M20.2 10.2C19.2 8.5 16.9 7.6 14.4 7.8C11.1 8 8.8 9.9 8.9 12.5C9 15 11 16.1 14.7 17.3C18.3 18.5 21.2 20 21.1 23.3C21 26.5 18.1 28.2 14.2 28C10.6 27.8 8 25.8 7.8 22.8" fill="none" stroke="#f4f0e6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="21.5" y="2.2" width="8.2" height="8.2" rx="1.5" fill="#8c3c2d" stroke="#f4f0e6" stroke-width="2"/>
</svg>
