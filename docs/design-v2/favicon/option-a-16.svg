<!-- Stallink favicon 设计稿，不是前端用的最终资源。
     不要复制进 web/src/app 或 web/public；等 Kel 选定后再由前端按 favicon-设计说明.md 导出。
     颜色全部取自现有 token，字形为 path，不依赖外部字体。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title">
  <title id="title">Stallink</title>
  <!-- 16px 简化：加粗笔画、略放大句点，避免句点贴上描边。导出 favicon.ico 的 16 档用此文件。 -->
  <circle cx="16" cy="16" r="16" fill="#262820"/>
  <circle cx="16" cy="16" r="15.1" fill="none" stroke="#e3f7a2" stroke-width="1.35"/>
  <path d="M19.5 8.6C18.6 6.8 16.3 5.9 13.8 6.2C10.7 6.5 8.6 8.4 8.8 10.9C9 13.2 11 14.25 14.3 15.3C17.8 16.4 20.8 17.85 20.6 21.2C20.4 24.8 17.1 26.8 13.1 26.3C9.8 25.9 7.5 23.6 7.35 20.8" fill="none" stroke="#e3f7a2" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="22.9" cy="23.2" r="2.15" fill="#e3f7a2"/>
</svg>
