<!-- Stallink favicon 设计稿，不是前端用的最终资源。
     不要复制进 web/src/app 或 web/public；等 Kel 选定后再由前端按 favicon-设计说明.md 导出。
     颜色全部取自现有 token，字形为 path，不依赖外部字体。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title">
  <title id="title">Stallink</title>
  <!-- 16px 简化：立柱加粗、号牌加大，去掉细描边以免吞掉帐篷边缘。 -->
  <rect width="32" height="32" rx="6" fill="#262820"/>
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#e3f7a2" stroke-width="1.2"/>
  <path d="M4.6 7.4 H27.4 L23.4 15.6 H8.6 Z" fill="#e3f7a2"/>
  <rect x="8.4" y="15.6" width="4" height="7.6" fill="#f4f0e6"/>
  <rect x="19.6" y="15.6" width="4" height="7.6" fill="#f4f0e6"/>
  <rect x="7" y="22.6" width="18" height="4" rx="0.4" fill="#f4f0e6"/>
  <rect x="17.2" y="8.8" width="6" height="4.8" rx="0.5" fill="#8c3c2d"/>
</svg>
