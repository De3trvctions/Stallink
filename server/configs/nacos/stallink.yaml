# 这是运行配置的仓库副本，也是 make nacos-publish 和 docker compose 上传到 Nacos 的内容。
# 进程不直接读这个文件。本地入口是 configs/local/stallink.yaml，它只写 Nacos 地址。
# 换机器时：docker compose up -d，再按 README 导出下面这些环境变量，然后 make dev、make web。
# ${...} 在 API 进程启动时展开，不要在发布前替换成真实密码。
server:
  name: stallink
  id: stallink-local
  version: 0.1.0
  http:
    addr: ":8080"
data:
  database:
    driver: postgres
    # 用 $NAME，不要写 ${NAME}。Kratos 会把 ${NAME} 当成配置项引用，找不到就变成空字符串。
    # 本机 compose 示例：postgres://postgres:stallink@127.0.0.1:5432/stallink?sslmode=disable
    source: "$STALLINK_DATABASE_SOURCE"
storage:
  dir: ./data
auth:
  platform_admin_login: platform
  platform_admin_password: "$STALLINK_PLATFORM_ADMIN_PASSWORD"
  # 本地 HTTP 必须是 false。放到 HTTPS 入口后再改成 true。
  secure_cookies: false
redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  key: stallink:platform:auto_approve
orders:
  require_idempotency: true
  reservations_enabled: true
  quote_ttl: 60s
  reservation_ttl: 15m
  sweep_interval: 30s
catalog:
  bundles_enabled: true
pricing:
  max_states: 100000
reports:
  daily_at: "00:10"
  timezone: Asia/Kuala_Lumpur
logging:
  level: info
  format: console
  outputs: ["stdout"]
  environment: local
